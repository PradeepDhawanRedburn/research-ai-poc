# Golden question set, DRAFT v0.1 (engineer-written; to be checked by analysts).
#
# Fields
#   id        stable identifier
#   doc       report the answer lives in
#   type      text_fact | table_lookup | chart_native | chart_picture | symbol_matrix | relationship | cross_document | unanswerable
#   question  what a user would ask
#   answer    expected answer (for the LLM-judged stage)
#   evidence  strings the answer rests on. Each item must be present; an item that is a list means "any one of these".
#             Matching is case-insensitive, ignores thousands separators and markdown punctuation, and maps
#             "✓ (green)" -> tick_green and "✗ (red)" -> cross_red.
#   group     links the two halves of a cross-document question
#
# Status: every item here was derived by reading the extracted content of the four reports, not the rendered
# pages. Analysts should confirm answers against the published PDFs before the set is used for sign-off.

