# Golden question set, v1.0, verified 30 October 2026.
#
# Verified means: every expected answer was checked against the report itself, through the Markdown+ conversion
# (text, tables, native chart data, digitised chart series and matrix cells in the facts file) and, for picture
# questions, by looking at the rendered picture. Values digitised from a drawing are quoted as approximate.
# Changes against the draft, dropped questions and the new ones are listed in docs/golden_set.md.
#
# Fields
#   id        stable identifier (prefix = report; MMX = needs both Money Maps; IMG = picture questions on any report)
#   doc       report holding the first evidence item (the primary report)
#   docs      cross-document questions only: every report the answer needs
#   type      text_fact | table_lookup | chart_native | chart_picture | symbol_matrix | image | relationship |
#             cross_document | unanswerable
#   question  what a user would ask
#   answer    expected answer, for the judge; unanswerable questions expect exactly "The documents do not say."
#   evidence  strings the answer rests on. Each item must be present in the Markdown+; an item that is a list means
#             "any one of these". Matching is case-insensitive after normalisation: curly quotes and dashes
#             straightened, thousands separators removed, Markdown punctuation stripped, whitespace collapsed,
#             "✓ (green)" -> tick_green and "✗ (red)" -> cross_red. Unanswerable questions have no evidence.
#   group     links the questions of one cross-document theme
#
# Counts: 122 questions; by type: chart_native 14, chart_picture 7, cross_document 10, image 18, relationship 6, symbol_matrix 13, table_lookup 14, text_fact 34, unanswerable 6;
# by primary report: RA01220 21, RA01734 26, RA02283 41, RA02752 34.

