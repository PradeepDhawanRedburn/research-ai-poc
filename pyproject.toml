[project]
name = "research-ingest"
version = "0.1.0"
description = "Deterministic extraction of research .docx reports into a canonical model, with a MarkItDown plugin"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "markitdown[docx]>=0.1.9",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
# Multimodal RAG (rag/): Azure AI Foundry models through LangChain, local Chroma
rag = [
    "azure-identity>=1.19",
    "chromadb>=1.0",
    "langchain-chroma>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "pillow>=11.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "truststore>=0.10",
]
agentic = [
    "azure-ai-projects==2.2.0",
    "azure-identity>=1.27.0",
    "azure-mgmt-cognitiveservices>=14.1.0",
    "azure-search-documents==12.1.0b2",
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "truststore>=0.10.5",
]

[project.entry-points."markitdown.plugin"]
research_ingest = "research_ingest.markitdown_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_ingest"]

[tool.uv]
package = true
