[project]
name = "research-ingest"
version = "0.1.0"
description = "Research reports Q&A: Word to Markdown+ with a MarkItDown plugin, Azure AI Search knowledge bases, Foundry agents"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "markitdown[docx]>=0.1.9",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
# Everything beyond the Word extractor: the store, Azure AI Search, Foundry agents, models, the app
azure = [
    "azure-ai-projects==2.2.0",
    "azure-identity>=1.27.0",
    "azure-search-documents==12.1.0b2",
    "azure-storage-blob>=12.25",
    "httpx>=0.28",  # azure-ai-projects imports httpx directly; openai>=3 uses httpx2 instead, so it is not pulled in
    "openai>=3.41.0",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "streamlit>=1.50",
    "truststore>=0.10",
]

# RETRIEVAL_BACKEND=langchain: Chroma + LangChain in place of Azure AI Search knowledge bases and Foundry agents
langchain = [
    "chromadb>=1.0",
    "langchain-chroma>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
]
dev = [
    "pytest>=8",
    "python-docx>=1.2",
    "python-pptx>=1.0",
]

[project.entry-points."markitdown.plugin"]
research_ingest = "research_ingest.markitdown_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_ingest", "research_qa"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
